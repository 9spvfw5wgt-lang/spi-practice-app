<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPI言語 練習アプリ</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">TODAY'S SPI</p>
        <h1>今日のSPI</h1>
        <p class="lead">iPhoneで毎日10問。正解位置は毎回シャッフル、間違えた問題だけすぐ復習できます。</p>
      </div>
      <div class="daily-card" aria-label="今日のチャレンジ">
        <span class="daily-card__label">10問チャレンジ</span>
        <strong>毎日3分</strong>
        <span>言語問題をサクッと積み上げ</span>
      </div>
    </header>

    <main>
      <section id="start-screen" class="card start-card">
        <div class="section-heading">
          <span class="section-kicker">Daily practice</span>
          <h2>今日の練習を始める</h2>
        </div>
        <p>直近に解いた問題はなるべく後回し。選択肢も毎回シャッフルして、正解位置の暗記を防ぎます。</p>
        <div class="challenge-strip" aria-label="今日の練習メニュー">
          <span>📱 片手で回答</span>
          <span>🔀 選択肢シャッフル</span>
          <span>📝 Notion復習</span>
        </div>
        <div class="settings">
          <label>
            出題数
            <select id="question-count">
              <option value="10">10問</option>
              <option value="15">15問</option>
              <option value="30">30問</option>
            </select>
          </label>
          <label>
            分野
            <select id="category-filter">
              <option value="all">全部</option>
              <option value="二語の関係">二語の関係</option>
              <option value="語句の意味">語句の意味</option>
              <option value="空欄補充">空欄補充</option>
            </select>
          </label>
        </div>
        <button id="start-btn" class="primary start-button">今日のチャレンジを始める</button>
      </section>

      <section id="quiz-screen" class="card quiz-card hidden">
        <div class="progress">
          <span id="progress-text">1 / 10</span>
          <span id="category-badge" class="badge"></span>
        </div>
        <div class="bar"><div id="bar-fill"></div></div>
        <div class="question-card">
          <h2 id="question-title"></h2>
          <p id="question-body"></p>
        </div>
        <div id="choices" class="choices"></div>
        <div class="quiz-actions">
          <button id="prev-btn" class="ghost">前へ</button>
          <button id="next-btn" class="primary">次へ</button>
        </div>
      </section>

      <section id="result-screen" class="card result-card hidden">
        <div class="section-heading">
          <span class="section-kicker">Result</span>
          <h2>今日の結果</h2>
        </div>
        <div class="score-card">
          <span class="score-card__label">SCORE</span>
          <p id="score" class="score"></p>
          <p id="score-label" class="score-label"></p>
        </div>
        <p id="feedback" class="feedback"></p>
        <div class="result-actions">
          <button id="retry-wrong-btn" class="primary retry-wrong-action">間違えた問題だけ再挑戦</button>
          <button id="retry-btn" class="ghost">条件を変えてもう一度</button>
          <button id="copy-notion-btn" class="ghost">間違いをNotion用にコピー</button>
        </div>
        <h3>復習</h3>
        <div id="review-list"></div>
      </section>
    </main>
  </div>

  <script src="./questions.js"></script>
  <script src="./app.js"></script>
</body>
</html>
