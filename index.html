<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPI言語 練習アプリ</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <p class="eyebrow">SPI 言語対策</p>
      <h1>SPI練習アプリ</h1>
      <p class="lead">iPhoneでも片手で解きやすく、最後に採点。間違えた問題だけNotion用にまとめたり再挑戦できます。</p>
    </header>

    <main>
      <section id="start-screen" class="card">
        <h2>練習を始める</h2>
        <p>今は「語句の関係」「二語の関係」「空欄補充」中心のスターター版です。</p>
        <p class="helper-text">直近に解いた問題はなるべく後回しにして出題します。</p>
        <div class="settings">
          <label>
            出題数
            <select id="question-count">
              <option value="10">10問</option>
              <option value="15">15問</option>
              <option value="30">30問</option>
            </select>
          </label>
          <label>
            分野
            <select id="category-filter">
              <option value="all">全部</option>
              <option value="二語の関係">二語の関係</option>
              <option value="語句の意味">語句の意味</option>
              <option value="空欄補充">空欄補充</option>
            </select>
          </label>
        </div>
        <button id="start-btn" class="primary">スタート</button>
      </section>

      <section id="quiz-screen" class="card hidden">
        <div class="progress">
          <span id="progress-text">1 / 10</span>
          <span id="category-badge" class="badge"></span>
        </div>
        <div class="bar"><div id="bar-fill"></div></div>
        <h2 id="question-title"></h2>
        <p id="question-body"></p>
        <div id="choices" class="choices"></div>
        <div class="quiz-actions">
          <button id="prev-btn" class="ghost">前へ</button>
          <button id="next-btn" class="primary">次へ</button>
        </div>
      </section>

      <section id="result-screen" class="card hidden">
        <h2>結果</h2>
        <p id="score" class="score"></p>
        <p id="feedback"></p>
        <div class="result-actions">
          <button id="retry-wrong-btn" class="primary">間違えた問題だけ再挑戦</button>
          <button id="retry-btn" class="ghost">条件を変えてもう一度</button>
          <button id="copy-notion-btn" class="ghost">間違いをNotion用にコピー</button>
        </div>
        <h3>復習</h3>
        <div id="review-list"></div>
      </section>
    </main>
  </div>

  <script src="./questions.js"></script>
  <script src="./app.js"></script>
</body>
</html>
